[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimforge"
version = "0.1.0"
description = "Live scientific claim verifier with LLM-as-judge evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shehbaz Pathan" }]
keywords = ["science", "claims", "openalex", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # TestClient follows Starlette and imports httpx2 when it is installed.
    "httpx2>=2.0",
]
# Local embedding ranker. CI does not install this extra: the default path
# ranks with TF-IDF cosine and stays offline.
embeddings = ["sentence-transformers>=3.0"]
# Optional. CI runs `ruff check` with the selection below. Not required to
# import or run ClaimForge.
lint = ["ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/shehbaz0101/claimforge"
Repository = "https://github.com/shehbaz0101/claimforge"

[project.scripts]
claimforge = "claimforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Bug-finding checks plus import order. E501 is omitted so Days 1–8 are not
# restyled for line length. `ruff check` in CI uses this selection.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: live network calls; soft-skip on connectivity or rate limits",
]
